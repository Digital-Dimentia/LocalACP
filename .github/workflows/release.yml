name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false
      skip_version_update:
        description: 'Skip version update (use when re-running after failed build)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Update version in all config files (only for workflow_dispatch)
  update-version:
    if: github.event_name == 'workflow_dispatch' && !inputs.skip_version_update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Normalise once, here, rather than at each use site. `npm version`
      # silently accepts and strips a leading `v`, but jq and sed do not: an
      # input of `v0.3.0` used to write a literal `version = "v0.3.0"` into
      # Cargo.toml, which is not valid semver and fails the build. Stripping
      # the prefix and rejecting anything that is still not `x.y.z` means the
      # run dies here, before it has pushed a commit and a tag.
      - name: Normalise the requested version
        id: version
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${{ inputs.version }}' is not a semver version (expected x.y.z, optionally v-prefixed)."
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Update version in package.json
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Update version in tauri.conf.json
        run: |
          jq '.version = "${{ steps.version.outputs.version }}"' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      - name: Update version in Cargo.toml and Cargo.lock
        run: |
          sed -i '0,/^version = ".*"/s//version = "${{ steps.version.outputs.version }}"/' src-tauri/Cargo.toml
          # Cargo.lock is committed and tauri's build precheck compares it
          # against Cargo.toml, so a bumped manifest with a stale lockfile
          # fails the build. `--offline` keeps this to the one local package.
          cargo update --offline --manifest-path src-tauri/Cargo.toml --package localacp

      - name: Commit and push version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push

      - name: Create and push tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

  # Get version from tag (for tag push trigger)
  get-version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

  # Build for all platforms
  build:
    needs: [update-version, get-version]
    if: always() && (needs.update-version.result == 'success' || needs.get-version.result == 'success' || needs.update-version.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: 'macOS-ARM64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: 'macOS-x64'
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux-x64'
          - platform: 'ubuntu-22.04-arm'
            args: ''
            name: 'Linux-ARM64'
          - platform: 'windows-latest'
            args: ''
            name: 'Windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.update-version.outputs.version || needs.get-version.outputs.version || inputs.version }}
          releaseName: 'LocalACP v${{ needs.update-version.outputs.version || needs.get-version.outputs.version || inputs.version }}'
          releaseBody: |
            ## What's New
            
            See the assets below to download LocalACP for your platform.
            
            ### Downloads
            - **Windows**: `.msi` (installer) or `.exe` (NSIS)
            - **macOS**: `.dmg` (Intel or Apple Silicon)
            - **Linux x64**: `.deb`, `.rpm`, or `.AppImage`
            - **Linux ARM64**: `.deb`, `.rpm`, or `.AppImage`
          releaseDraft: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          args: ${{ matrix.args }}

  # Publish the release after all builds complete
  publish:
    needs: [build, update-version, get-version]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get release info
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.update-version.outputs.version || needs.get-version.outputs.version || inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Get the release ID
          RELEASE_ID=$(gh release view "v$VERSION" --json id -q '.id' 2>/dev/null || echo "")
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Publish release
        if: steps.release.outputs.release_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ steps.release.outputs.version }}" --draft=false
