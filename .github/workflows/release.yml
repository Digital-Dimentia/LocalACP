name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false
      skip_version_update:
        description: 'Skip version update (use when re-running after failed build)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Normalise the dispatch input once, in its own job, so every later job reads
  # one already-validated value and none of them touch `inputs.version` again.
  #
  # It has to be a separate job rather than a step inside `update-version`,
  # because `update-version` is skipped under `skip_version_update` -- and the
  # re-run path that flag exists for is exactly the one that still needs a
  # version to check out and tag.
  #
  # Why normalise at all: `npm version` silently accepts and strips a leading
  # `v`, but jq and sed do not. An input of `v0.3.0` wrote a literal
  # `version = "v0.3.0"` into Cargo.toml -- not valid semver -- and the run only
  # discovered it during the build, after the version commit and the `v0.3.0`
  # tag had already been pushed. Failing here costs nothing.
  resolve-version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Normalise the requested version
        id: version
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${{ inputs.version }}' is not a semver version (expected x.y.z, optionally v-prefixed)."
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

  # Update version in all config files (only for workflow_dispatch)
  update-version:
    needs: resolve-version
    if: github.event_name == 'workflow_dispatch' && !inputs.skip_version_update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # `npm pkg set` rather than `npm version`: the latter exits non-zero with
      # "Version not changed" when package.json already holds the target, which
      # makes re-running a release that failed downstream impossible. Every step
      # in this job states a desired end state instead of a transition, so the
      # job is safe to re-run.
      - name: Update version in package.json
        run: npm pkg set version="${{ needs.resolve-version.outputs.version }}"

      - name: Update version in tauri.conf.json
        run: |
          jq '.version = "${{ needs.resolve-version.outputs.version }}"' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      # Cargo.lock is committed (see the note in .gitignore) and tauri's build
      # precheck compares it against Cargo.toml, so both have to move together
      # or the build this run is cutting fails on a lockfile mismatch.
      #
      # The lockfile is edited as text rather than by `cargo update -p localacp`
      # because that needs a resolvable dependency graph: `--offline` fails on a
      # clean runner (no registry cache -- "no matching package named `dirs`"),
      # and dropping it means a crates.io round-trip for every dependency, all
      # to rewrite one line whose value is already known. The helper fails loudly
      # if it cannot find exactly one matching entry.
      - name: Update version in Cargo.toml and Cargo.lock
        run: |
          sed -i '0,/^version = ".*"/s//version = "${{ needs.resolve-version.outputs.version }}"/' src-tauri/Cargo.toml
          python3 scripts/bump-lock-version.py localacp "${{ needs.resolve-version.outputs.version }}" src-tauri/Cargo.lock

      - name: Commit and push version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          # Already at the target version -- a re-run, or a release cut from a
          # branch someone bumped by hand. Nothing to record, and `git commit`
          # treats that as an error, so say so and carry on to the tag.
          if git diff --cached --quiet; then
            echo "Already at v${{ needs.resolve-version.outputs.version }}; no version commit needed."
          else
            git commit -m "chore: release v${{ needs.resolve-version.outputs.version }}"
            git push
          fi

      # Moving a tag would silently change what an existing release points at,
      # so refuse instead. Deleting the old tag is a deliberate act and belongs
      # with the person who decided to re-cut the release.
      - name: Create and push tag
        run: |
          tag="v${{ needs.resolve-version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            remote_sha=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse "$remote_sha^{commit}" 2>/dev/null)" ]; then
              echo "Tag $tag already points at this commit; nothing to do."
              exit 0
            fi
            echo "::error::Tag $tag already exists on origin and points elsewhere. Delete it first: git push origin :refs/tags/$tag"
            exit 1
          fi
          git tag "$tag"
          git push origin "$tag"

  # Get version from tag (for tag push trigger)
  get-version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

  # Build for all platforms
  build:
    needs: [resolve-version, update-version, get-version]
    # `always()` is needed because two of the three upstream jobs are skipped on
    # any given trigger, but it also means an outright failure no longer stops
    # this job on its own -- a skipped `update-version` looks the same whether
    # it was skipped by `skip_version_update` or because `resolve-version`
    # rejected the input. So failures are excluded explicitly, and the run needs
    # a version from somewhere: `get-version` on a tag push, `resolve-version`
    # on a dispatch.
    if: |
      always()
      && needs.resolve-version.result != 'failure'
      && needs.update-version.result != 'failure'
      && (needs.get-version.result == 'success' || needs.resolve-version.result == 'success')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: 'macOS-ARM64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: 'macOS-x64'
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux-x64'
          - platform: 'ubuntu-22.04-arm'
            args: ''
            name: 'Linux-ARM64'
          - platform: 'windows-latest'
            args: ''
            name: 'Windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.resolve-version.outputs.version) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.update-version.outputs.version || needs.get-version.outputs.version || needs.resolve-version.outputs.version }}
          releaseName: 'LocalACP v${{ needs.update-version.outputs.version || needs.get-version.outputs.version || needs.resolve-version.outputs.version }}'
          releaseBody: |
            ## What's New
            
            See the assets below to download LocalACP for your platform.
            
            ### Downloads
            - **Windows**: `.msi` (installer) or `.exe` (NSIS)
            - **macOS**: `.dmg` (Intel or Apple Silicon)
            - **Linux x64**: `.deb`, `.rpm`, or `.AppImage`
            - **Linux ARM64**: `.deb`, `.rpm`, or `.AppImage`
          releaseDraft: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          args: ${{ matrix.args }}

  # Publish the release after all builds complete
  publish:
    needs: [build, resolve-version, update-version, get-version]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get release info
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.update-version.outputs.version || needs.get-version.outputs.version || needs.resolve-version.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Get the release ID
          RELEASE_ID=$(gh release view "v$VERSION" --json id -q '.id' 2>/dev/null || echo "")
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Publish release
        if: steps.release.outputs.release_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ steps.release.outputs.version }}" --draft=false
