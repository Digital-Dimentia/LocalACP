[package]
name = "acp-ui"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "acp_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Named explicitly rather than defaulting to the package name, because macOS
# shows this filename as the application name -- in the Dock and in the
# "About X" / "Hide X" / "Quit X" menu items -- whenever the app runs unbundled,
# which is every `tauri dev` session. Kept in step with `branding.json` by
# `scripts/apply-branding.mjs`; do not edit by hand.
[[bin]]
name = "LocalACP"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "6", features = ["macos_fsevent"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
indexmap = { version = "2", features = ["serde"] }
shell-escape = "0.1"

